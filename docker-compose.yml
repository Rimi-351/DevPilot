version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devpilot_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=DevPilot
      - VERSION=0.1.0
      - DEBUG=True
      - API_V1_STR=/api/v1
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///app/storage/devpilot.db}
      - CHUNK_SIZE=512
      - CHUNK_OVERLAP=64
      - UPLOAD_DIR=storage/uploads
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-20b}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - EMBEDDING_MOCK=${EMBEDDING_MOCK:-false}
      - LLM_MOCK=${LLM_MOCK:-false}
    volumes:
      - storage_data:/app/storage
      - artifacts_data:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional PostgreSQL service for production parity
  db:
    image: postgres:16-alpine
    container_name: devpilot_db
    restart: unless-stopped
    profiles:
      - postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  storage_data:
    driver: local
  artifacts_data:
    driver: local
  postgres_data:
    driver: local
